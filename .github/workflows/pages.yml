name: Demo (GitHub Pages)

# Publishes the demo of the app: the front with the example portfolio (front/public/demo/, made by
# back/scripts/demo-fixtures.js) and the guided tour. No back end: on github.io the app always runs in demo mode
# (front/src/app/demo/demo-mode.ts → STATIC_SITE). Only after CI passes on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build de la demo
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      # https://<usuario>.github.io/<repositorio>/
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      # GitHub Pages has no URL rewriting: 404.html is the app too, so /finanzas/resumen works on reload.
      - run: cp dist/front/browser/index.html dist/front/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: front/dist/front/browser

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
