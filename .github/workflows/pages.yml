name: Web (GitHub Pages)

# Publishes, only after CI passes on main (front/scripts/pages-mount.sh):
#   /finanzas/      the demo: example portfolio (front/public/demo/, made by back/scripts/demo-fixtures.js) and the
#                   guided tour, no back end (front/src/app/demo/demo-mode.ts → STATIC_SITE)
#   /finanzas/app/  the real app, calling the API on the server: only when the repository variable API_URL is set
#                   (Settings → Secrets and variables → Actions → Variables), see docs/09-despliegue.md
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build de la demo
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      # https://<usuario>.github.io/<repositorio>/ (demo) and …/app/ (real app), each with its CSP, and a 404.html
      # that sends a reload of any page to the right one.
      - run: bash scripts/pages-mount.sh "${{ github.event.repository.name }}" pages "${{ vars.API_URL }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: front/pages

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
