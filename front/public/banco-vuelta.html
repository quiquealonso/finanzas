<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Volviendo a Finanzas…</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 48px 20px; }
    a { color: #a5b4fc; }
  </style>
</head>
<body>
<main>
  <h2>Volviendo a Finanzas…</h2>
  <p id="msg">Tu banco ha respondido. Te llevamos a la app que tienes abierta en este ordenador.</p>
  <noscript><p>Hace falta JavaScript para volver a la app.</p></noscript>
</main>
<script>
  // Bridge for the Open Banking consent (page Gastos): Enable Banking only accepts https return URLs, and the app's
  // back runs on http://localhost. The bank sends the user here (https) and this page passes the answer on to the
  // back on this same computer. Only these fields go through, always to the same fixed address (no open redirect).
  // The one-time "code" is useless without the app's private key, which never leaves the computer.
  (function () {
    var BACK = 'http://localhost:3000/api/banking/callback';
    var from = new URLSearchParams(location.search);
    var to = new URLSearchParams();
    ['code', 'state', 'error', 'error_description'].forEach(function (k) {
      var v = from.get(k);
      if (v !== null) to.set(k, v.slice(0, 2000));
    });
    if (!to.has('state')) {
      document.getElementById('msg').textContent = 'Este enlace no viene de tu banco. Vuelve a la app y pulsa «Conectar banco».';
      return;
    }
    history.replaceState(null, '', location.pathname); // do not keep the code in the browser history
    location.replace(BACK + '?' + to.toString());
  })();
</script>
</body>
</html>
