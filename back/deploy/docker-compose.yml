# Public server (docs/09-despliegue.md): the API and Caddy (HTTPS with Let's Encrypt) in Docker on a Google Cloud VM.
# The database stays in Supabase. Variables and secrets: .env in this folder (not in Git, see .env.example).
# Start: docker compose up -d --build (deploy.sh does it on each deployment).
name: finanzas

# Docker logs with rotation: at most 5 files of 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    logging: *logging
    build: ..
    restart: unless-stopped
    # No "ports": only Caddy reaches it, on Docker's internal network.
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY: "1"
      # Public server: Gmail and banks only sync from the owner's computer; no timers here (src/server-mode.ts).
      INTEGRATIONS: "off"
      BACKGROUND_JOBS: "off"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  caddy:
    logging: *logging
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Falta API_DOMAIN en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:
